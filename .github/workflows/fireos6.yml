name: Fire OS 6 build

# Automatic Fire OS 6 / Android 7.1 build of FMHYPlay, official releases only.
# Every 2 days it looks at the developer's newest official release (not the work in progress on main). When there is a new
# one it applies the Android 7.1 changes, builds, checks the result, and publishes the TV APK as a new release in this fork.
# If any check fails nothing is published, so the last good APK stays in place.
# Newest APK, always the same link: https://github.com/<your user>/android/releases/latest/download/FMHYPlay-TV-fireos6.apk
# You can also run it by hand: Actions > Fire OS 6 build > Run workflow (tick "force" to rebuild the same version).

on:
  schedule:
    - cron: "23 4 */2 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this version was already built"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fireos6-build
  cancel-in-progress: false

env:
  UPSTREAM: fmhyplay/android

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
      tag: ${{ steps.c.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Touch the saved signing key so GitHub does not delete it
        uses: actions/cache/restore@v4
        with:
          path: |
            release.jks
            release.pass
          key: signing-key-v1

      - name: Keep the schedule alive (GitHub pauses schedules after 60 quiet days)
        run: |
          LAST=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - LAST )) -gt 2592000 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit --allow-empty -m "Keep the Fire OS 6 schedule active"
            git push
          fi

      - name: Look for a new official release from the developer
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          if [ -z "$TAG" ]; then echo "Could not read the newest release of $UPSTREAM"; exit 1; fi
          REFS=$(git ls-remote "https://github.com/$UPSTREAM.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          SHA=$(echo "$REFS" | grep '\^{}$' | cut -f1 | head -1)
          if [ -z "$SHA" ]; then SHA=$(echo "$REFS" | head -1 | cut -f1); fi
          if [ -z "$SHA" ]; then echo "Could not find the code for release $TAG"; exit 1; fi
          BUILD=true
          if [ "$FORCE" != "true" ]; then
            if gh release view "fireos6-$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
               || gh release view "fireos6-failed-$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              BUILD=false
            fi
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Newest official release is $TAG (${SHA:0:7}), build needed: $BUILD"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHA: ${{ needs.check.outputs.sha }}
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the developer's code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.sha }}

      - name: Apply the Android 7.1 changes
        run: |
          python3 - <<'PYEOF'
          import pathlib

          SRC = "src/me/champdev/weblock/"

          def rep(path, old, new, count=1):
              p = pathlib.Path(path)
              s = p.read_text(encoding="utf-8")
              n = s.count(old)
              if n != count:
                  raise SystemExit("PATCH FAILED in %s: expected %d match(es), found %d, for: %s" % (path, count, n, old[:70]))
              p.write_text(s.replace(old, new), encoding="utf-8")

          # 1. Build for Android 7.1 (API 25) instead of 8.0 (API 26)
          rep("build.sh", "--min-sdk-version 26", "--min-sdk-version 25", 2)
          rep("build.sh", "--min-api 26", "--min-api 25")
          rep("warp/build.sh", "aarch64-linux-android26", "aarch64-linux-android25")
          rep("warp/build.sh", "armv7a-linux-androideabi26", "armv7a-linux-androideabi25")

          # 2. Helpers for things that only exist from Android 8
          pathlib.Path(SRC + "Compat.java").write_text('''package me.champdev.weblock;

          import android.content.Context;
          import android.content.Intent;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.text.SimpleDateFormat;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Locale;
          import java.util.TimeZone;

          /** Stand-ins for APIs that need Android 8 (String.join, java.time, java.nio.file, startForegroundService). */
          final class Compat {
              private Compat() { }

              static String join(CharSequence sep, Iterable<? extends CharSequence> parts) {
                  StringBuilder b = new StringBuilder();
                  boolean first = true;
                  for (CharSequence p : parts) {
                      if (!first) b.append(sep);
                      b.append(p);
                      first = false;
                  }
                  return b.toString();
              }

              static String join(CharSequence sep, CharSequence... parts) { return join(sep, Arrays.asList(parts)); }

              /** Days since 1970-01-01 for today's local date. */
              static long today() {
                  long now = System.currentTimeMillis();
                  return Math.floorDiv(now + TimeZone.getDefault().getOffset(now), 86400000L);
              }

              /** The calendar year it was `daysAgo` days ago. */
              static int year(int daysAgo) {
                  Calendar c = Calendar.getInstance();
                  c.add(Calendar.DAY_OF_YEAR, -daysAgo);
                  return c.get(Calendar.YEAR);
              }

              /** Days since 1970-01-01 for a yyyy-MM-dd date; IllegalArgumentException when it is not one. */
              static long epochDay(String ymd) {
                  SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd", Locale.US);
                  f.setLenient(false);
                  f.setTimeZone(TimeZone.getTimeZone("UTC"));
                  try {
                      return Math.floorDiv(f.parse(ymd).getTime(), 86400000L);
                  } catch (java.text.ParseException e) {
                      throw new IllegalArgumentException(e);
                  }
              }

              static String readAll(File f) throws IOException {
                  try (InputStream in = new FileInputStream(f)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      return new String(out.toByteArray(), java.nio.charset.Charset.forName("UTF-8"));
                  }
              }

              static void startFg(Context c, Intent i) {
                  if (android.os.Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
              }
          }
          ''', encoding="utf-8")

          # 3. String.join -> Compat.join
          for f, n in [("AdBlock.java", 1), ("Catalog.java", 2), ("PlayerActivity.java", 1), ("Sites.java", 1), ("Iptv.java", 2), ("TitleActivity.java", 1)]:
              rep(SRC + f, "String.join(", "Compat.join(", n)

          # 4. java.nio.file / java.time
          rep(SRC + "SubSync.java", "import java.nio.file.Files;\n", "")
          rep(SRC + "SubSync.java", "new String(Files.readAllBytes(f.toPath()), StandardCharsets.UTF_8)", "Compat.readAll(f)")
          rep(SRC + "Catalog.java", "java.time.LocalDate now = java.time.LocalDate.now();\n        long today = now.toEpochDay();", "long today = Compat.today();")
          rep(SRC + "Catalog.java", "for (int year = now.getYear(); year >= now.minusDays(200).getYear(); year--)", "for (int year = Compat.year(0); year >= Compat.year(200); year--)")
          rep(SRC + "Catalog.java", "java.time.LocalDate.now().minusDays(120).getYear()", "Compat.year(120)")
          rep(SRC + "Catalog.java", "java.time.LocalDate.parse(t.released.substring(0, 10)).toEpochDay()", "Compat.epochDay(t.released.substring(0, 10))")
          rep(SRC + "Catalog.java", "catch (java.time.format.DateTimeParseException e)", "catch (IllegalArgumentException e)")

          for jf in pathlib.Path("src").rglob("*.java"):
              t = jf.read_text(encoding="utf-8")
              if "java.time.LocalDate.now().toEpochDay()" in t:
                  jf.write_text(t.replace("java.time.LocalDate.now().toEpochDay()", "Compat.today()"), encoding="utf-8")

          # 5. Cast service and notification
          rep(SRC + "Cast.java", "c.startForegroundService(new Intent(c, Keep.class))", "Compat.startFg(c, new Intent(c, Keep.class))")
          rep(SRC + "Chromecast.java", "c.startForegroundService(new Intent(c, Cast.Keep.class))", "Compat.startFg(c, new Intent(c, Cast.Keep.class))")
          rep(SRC + "Cast.java", "getSystemService(NotificationManager.class).createNotificationChannel(", "if (android.os.Build.VERSION.SDK_INT >= 26) getSystemService(NotificationManager.class).createNotificationChannel(")
          rep(SRC + "Cast.java", 'new Notification.Builder(this, "cast")', '(android.os.Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, "cast") : new Notification.Builder(this))')

          # 6. View methods from Android 8: guard every plain statement that calls them
          import re
          for jf in pathlib.Path("src").rglob("*.java"):
              t = jf.read_text(encoding="utf-8")
              t2 = re.sub(r"(?m)^(\s*)((?:\w+\.)*\w+\.(?:setTooltipText|setDefaultFocusHighlightEnabled)\(.*\);)(\s*(?://.*)?)$",
                          lambda m: m.group(0) if "SDK_INT" in m.group(0) else m.group(1) + "if (android.os.Build.VERSION.SDK_INT >= 26) " + m.group(2) + m.group(3), t)
              if t2 != t:
                  jf.write_text(t2, encoding="utf-8")
          rep(SRC + "PlayerActivity.java", "return !App.tv && player != null", "return android.os.Build.VERSION.SDK_INT >= 26 && !App.tv && player != null")

          # 7. Saved site logins (WebViewDatabase methods are from Android 8; the WebView ones do the same before that)
          rep(SRC + "WebActivity.java", "String[] saved = db.getHttpAuthUsernamePassword(host, realm);",
              "String[] saved = android.os.Build.VERSION.SDK_INT >= 26 ? db.getHttpAuthUsernamePassword(host, realm) : web.getHttpAuthUsernamePassword(host, realm);")
          rep(SRC + "WebActivity.java", "db.setHttpAuthUsernamePassword(host, realm, u, p);",
              "if (android.os.Build.VERSION.SDK_INT >= 26) db.setHttpAuthUsernamePassword(host, realm, u, p); else web.setHttpAuthUsernamePassword(host, realm, u, p);")

          # 8. One optional-chaining call in the page script (needs a newer WebView than Android 7.1 usually has)
          rep("assets/roles.js", "const add = n => ((n.getAttribute('class') || '')", "const add = n => (((n.getAttribute('class') || '')")
          rep("assets/roles.js", ")?.forEach(t => out.add(t.toLowerCase()));", ") || []).forEach(t => out.add(t.toLowerCase()));")

          # 9. Safety net: stop the build if any call that crashes on Android 7.1 is left without a version check
          bad = re.compile(r"String\.join\(|java\.time\.|java\.nio\.file|\.startForegroundService\(|setTooltipText\(|setDefaultFocusHighlightEnabled\(|NotificationChannel\(|getSystemService\(NotificationManager")
          left = []
          for jf in pathlib.Path("src").rglob("*.java"):
              if jf.name == "Compat.java":
                  continue
              for i, line in enumerate(jf.read_text(encoding="utf-8").split("\n"), 1):
                  code = line.split("//")[0]
                  if bad.search(code) and "SDK_INT >= 26" not in code:
                      left.append("%s:%d: %s" % (jf, i, line.strip()[:120]))
          if left:
              raise SystemExit("PATCH INCOMPLETE, new Android 8 only code found:\n" + "\n".join(left))
          print("patch applied")
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: warp/go.mod
          cache-dependency-path: warp/go.sum

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "platforms;android-25" "build-tools;35.0.0" > /dev/null

      - name: Build the WARP helper
        run: warp/build.sh

      - name: Signing key (kept between builds so a new build installs over the old one)
        uses: actions/cache@v4
        with:
          path: |
            release.jks
            release.pass
          key: signing-key-v1

      - name: Build
        run: |
          if [ -z "$TAG" ]; then echo "No release tag"; exit 1; fi
          VERSION_CODE=$(( 300000000 + GITHUB_RUN_NUMBER )) VERSION_NAME="${TAG#v}-fireos6" ./build.sh

      - name: Check 1, no code that crashes on Android 7.1
        run: |
          python3 - <<'PYEOF'
          import glob, os, re, shlex, subprocess, sys

          # Compile the app against the Android 7.1 (API 25) class list. Anything that does not exist there must be behind
          # an "SDK_INT >= 26" (or higher) check on the same line, or be one of the already-known guarded spots below.
          KNOWN = set("""
          App.java|cannot find symbol|symbol: method getProcessName()
          Cast.java|cannot find symbol|symbol: class NotificationChannel
          PlayerActivity.java|cannot find symbol|symbol: class PictureInPictureParams
          PlayerActivity.java|cannot find symbol|symbol: class RemoteAction
          PlayerActivity.java|cannot find symbol|symbol: method getDisplayCutout()
          PlayerActivity.java|method does not override or implement a method from a supertype|
          PlayerActivity.java|method onPictureInPictureModeChanged in class Activity cannot be applied to given types;|
          PlayerActivity.java|package android.app.PictureInPictureParams does not exist|
          WebActivity.java|cannot find symbol|symbol: variable Downloads
          """.strip().split("\n"))

          sdk = os.environ.get("ANDROID_HOME", "")
          jar25 = sdk + "/platforms/android-25/android.jar"
          if not os.path.exists(jar25):
              raise SystemExit("GATE: the Android 7.1 class list is missing: " + jar25)
          bts = sorted(glob.glob(sdk + "/build-tools/*"), key=lambda p: [int(x) if x.isdigit() else 0 for x in re.split(r"[.\-]", os.path.basename(p))])
          stubs = (bts[-1] + "/core-lambda-stubs.jar") if bts else ""
          boot = jar25 + (":" + stubs if stubs and os.path.exists(stubs) else "")
          srcs = glob.glob("src/**/*.java", recursive=True) + glob.glob("build/me/**/*.java", recursive=True)
          libs = ":".join(sorted(glob.glob("libs/*.jar")))
          os.makedirs("/tmp/gate-classes", exist_ok=True)
          cmd = shlex.split(os.environ.get("JAVAC", "javac")) + ["-encoding", "UTF-8", "-nowarn", "-Xlint:-options", "-Xmaxerrs", "5000",
                 "-proc:none", "-source", "8", "-target", "8", "-bootclasspath", boot, "-classpath", libs, "-d", "/tmp/gate-classes"] + srcs
          out = subprocess.run(cmd, capture_output=True, text=True)
          text = out.stdout + out.stderr

          head = re.compile(r"^(\S+\.java):(\d+): error: (.*)$")
          errs, cur = [], None
          for line in text.split("\n"):
              m = head.match(line)
              if m:
                  cur = {"file": m.group(1), "line": int(m.group(2)), "msg": m.group(3).strip(), "sym": ""}
                  errs.append(cur)
              elif cur is not None and line.strip().startswith("symbol:") and not cur["sym"]:
                  cur["sym"] = re.sub(r"\s+", " ", line.strip())

          guard = re.compile(r"SDK_INT\s*(>=\s*(2[6-9]|[3-9]\d)|>\s*(2[5-9]|[3-9]\d))")
          bad, seen = [], 0
          for e in errs:
              if "package R does not exist" in e["msg"] or re.search(r"(class|variable) R$", e["sym"]):
                  continue
              try:
                  src = open(e["file"], encoding="utf-8").read().split("\n")[e["line"] - 1]
              except Exception:
                  src = ""
              if "ambiguous" in e["msg"] and re.search(r"\bR\.\w+\.\w+", src):
                  continue   # only caused by the generated resource class missing from this check
              seen += 1
              key = "%s|%s|%s" % (os.path.basename(e["file"]), e["msg"], e["sym"])
              if key in KNOWN or guard.search(src):
                  continue
              bad.append((key, "%s:%d: %s" % (e["file"], e["line"], src.strip()[:110])))

          if os.environ.get("GATE_LEARN"):
              for k, _ in bad:
                  print(k)
              sys.exit(0)
          print("Android 7.1 check: %d calls above Android 7.1 found, all behind version checks" % seen if not bad else "")
          if bad:
              print("Android 7.1 check FAILED. Code that would crash on Android 7.1 and has no version check:")
              for k, where in bad:
                  print("  " + where + "\n    " + k)
              sys.exit(1)
          PYEOF

      - name: Check 2, the APK itself
        run: |
          APK=$(ls FMHYPlay-TV-v*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1 || true
          MIN=$(sed -nE "s/^(minS|s)dkVersion:'([0-9]+)'.*/\2/p" /tmp/badging.txt | head -1)
          if [ -z "$MIN" ]; then
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt 2>&1 || true
            MIN=$(sed -nE 's/.*minSdkVersion[^=]*=([0-9]+).*/\1/p' /tmp/manifest.txt | head -1)
          fi
          echo "$APK needs Android API ${MIN:-unknown} or newer"
          if [ -z "$MIN" ]; then
            echo "Could not read the minimum Android version. What the tools printed:"
            head -15 /tmp/badging.txt
            head -30 /tmp/manifest.txt
            exit 1
          fi
          if [ "$MIN" -gt 25 ]; then echo "The APK needs a newer Android than Fire OS 6"; exit 1; fi
          "$BT/apksigner" verify --min-sdk-version 25 "$APK"
          if ! unzip -l "$APK" | grep -q "lib/armeabi-v7a/"; then echo "The 32-bit ARM files are missing from the APK"; exit 1; fi
          echo "APK checks passed"

      - name: Publish the TV APK as the newest release
        run: |
          REL="fireos6-$TAG"
          APK=$(ls FMHYPlay-TV-v*.apk)
          V=$(echo "$APK" | sed 's/FMHYPlay-TV-v//; s/\.apk$//')
          cp "$APK" FMHYPlay-TV-fireos6.apk
          for t in "$REL" "fireos6-failed-$TAG"; do
            gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done
          gh release create "$REL" FMHYPlay-TV-fireos6.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "FMHYPlay ${TAG#v} for Fire OS 6" \
            --notes "Built from the developer official release https://github.com/$UPSTREAM/releases/tag/$TAG with the Android 7.1 changes. Install FMHYPlay-TV-fireos6.apk. It passed the Android 7.1 checks."
          # keep the newest 5 good builds and the newest 5 blocked-build notes, delete the rest
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select((.tagName | startswith("fireos6")) and ((.tagName | startswith("fireos6-failed")) | not))] | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true; done
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("fireos6-failed"))] | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true; done
          echo "Published $REL ($V)" >> "$GITHUB_STEP_SUMMARY"

      - name: Note that this version did not pass (the last good APK stays as it is)
        if: failure()
        run: |
          gh release create "fireos6-failed-$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Blocked: developer release $TAG did not pass the Fire OS 6 checks" \
            --notes "Nothing was published for this release and your last good APK is unchanged. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . It is retried when the developer publishes a newer release, or run the workflow by hand with force ticked." || true
